name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # or use 'main' if that's your default

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker to use gcloud
      run: gcloud auth configure-docker

    - name: Build and push Docker image to Artifact Registry
      run: |
        docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/olympics-data-search-app:$GITHUB_SHA .
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/olympics-data-search-app:$GITHUB_SHA
      env:
        PROJECT_ID: olympics-data-search-app
        REGION: europe-west1
        REPOSITORY: olympics-docker

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy olympics-data-search-app \
          --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/olympics-data-search-app:$GITHUB_SHA \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --port 8080
      env:
        PROJECT_ID: olympics-data-search-app
        REGION: europe-west1
        REPOSITORY: olympics-docker
