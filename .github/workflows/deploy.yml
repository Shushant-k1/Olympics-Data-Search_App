name: Deploy to Cloud Run (No Buckets)

on:
  push:
    branches:
      - main  # adjust if you deploy from another branch

env:
  PROJECT_ID: my-first-project             # ← Replace if needed
  REGION: europe-west1
  SERVICE_NAME: olympics-data-search-app
  REPO_NAME: olympics-app-repo             # ← Replace if you named it differently
  IMAGE_NAME: olympics-data-search-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t europe-west1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:$GITHUB_SHA .

    - name: Push Docker image
      run: |
        docker push europe-west1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:$GITHUB_SHA

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image=europe-west1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:$GITHUB_SHA \
          --region=${{ env.REGION }} \
          --platform=managed \
          --allow-unauthenticated \
          --min-instances=1
