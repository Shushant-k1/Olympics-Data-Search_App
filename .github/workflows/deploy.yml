name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v2

    - name: Build and Push Docker Image
      run: |
        gcloud builds submit \
          --tag europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympics-data-search_app/olympics-data-search-app:$GITHUB_SHA

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy olympics-data-search-app \
          --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympics-data-search_app/olympics-data-search-app:$GITHUB_SHA \
          --region=europe-west1 \
          --platform=managed \
          --allow-unauthenticated \
          --min-instances=1
